name: Account service (tests)

# Riwaq's optional accounts (docs/ACCOUNTS.md): tests only. This workflow
# never deploys, never applies a migration to Cloudflare and never reads a
# Cloudflare token: merging a change to server/accounts changes nothing in
# production (PR #155 third review, deployment gate). Deploying is the
# separate, manual workflow accounts-deploy.yml, run by the owner.

on:
  push:
    branches: [main]
    paths:
      - "server/accounts/**"
      - "core/account*.mjs"
      - "scripts/test-account*.mjs"
      - "tests/account*.test.mjs"
      - ".github/workflows/accounts*.yml"
  pull_request:
    paths:
      - "server/accounts/**"
      - "core/account*.mjs"
      - "scripts/test-account*.mjs"
      - "tests/account*.test.mjs"
      - ".github/workflows/accounts*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # bash with -e and -o pipefail: a failing command fails its step,
        # even inside a pipeline.
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The released apps' code (git archive of their tags) is tested
          # against this Worker across migration 0003.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The service, its database integrity and the client against it
        run: node --test tests/accounts-server.test.mjs tests/accounts-integrity.test.mjs tests/accounts-instances.test.mjs tests/accounts-workflow.test.mjs tests/account.test.mjs
      - name: Released apps across the old Worker, migration 0003 and this Worker
        run: |
          git fetch --no-tags origin tag v0.40.0 tag v0.54.0 tag v0.55.0
          node scripts/test-accounts-released.mjs
      - name: The Worker in workerd with a local D1 (no Cloudflare account)
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund wrangler@4.141.0
          RIWAQ_WRANGLER="$RUNNER_TEMP/wrangler/node_modules/wrangler/bin/wrangler.js" \
            node scripts/test-accounts-workerd.mjs
