name: Check source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # ubuntu-latest became 26.04, where Playwright 1.56.1 refuses to install
    # Chromium ("does not support chromium on ubuntu26.04-x64"), so the web
    # smoke never ran on pull requests; 24.04 is supported (PR #155 fourth
    # pass).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run build:web
      - name: Smoke-test the web edition in Chromium
        run: |
          npm install --global playwright@1.56.1
          playwright install --with-deps chromium
          node scripts/test-web.mjs
          node scripts/test-hud-keys.mjs
