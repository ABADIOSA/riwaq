name: Release Windows build

# Riwaq targets Windows x64 and links Win32 through Koffi, so the portable
# executable is built on a real Windows runner. Cross-building from Linux
# silently bundles the wrong Koffi native module and the wrong Electron
# distribution, which produces an executable that starts and then fails to
# create the embedded video surface.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag matching package.json, for example v0.8.0. Leave empty to build without releasing."
        required: false
        type: string
      channel:
        description: "Release channel (stable or beta)"
        required: true
        default: beta
        type: choice
        options: [beta, stable]

concurrency:
  group: riwaq-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch the pinned MPV build
        run: node scripts/fetch-mpv.mjs
      - run: npm test
      - run: npm run check
      - run: npm run package
      - name: Sign the update package
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          RIWAQ_UPDATE_PRIVATE_KEY: ${{ secrets.RIWAQ_UPDATE_PRIVATE_KEY }}
          RIWAQ_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RIWAQ_RELEASE_CHANNEL: ${{ inputs.channel || 'beta' }}
        run: node scripts/sign-release.mjs
      - name: Record the artifact checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: riwaq-win-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/riwaq-update.json
          retention-days: 14
      # gh creates the tag itself, which is how a release is cut when a tag
      # cannot be pushed directly to the remote.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          CHANNEL: ${{ inputs.channel || 'beta' }}
        run: |
          # Upload every artifact to a draft first; clients must never see a
          # published release whose signed manifest or installer is missing.
          $files = @(Get-ChildItem release/*.exe | ForEach-Object { $_.FullName })
          gh release create "$env:TAG" @files release/SHA256SUMS.txt release/riwaq-update.json --draft --target "${{ github.sha }}" --title "رِواق $env:TAG" --notes-file .github/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; nothing was published.' }
          if ($env:CHANNEL -eq 'stable') {
            gh release edit "$env:TAG" --draft=false --prerelease=false --latest
          } else {
            gh release edit "$env:TAG" --draft=false --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect the draft.' }
